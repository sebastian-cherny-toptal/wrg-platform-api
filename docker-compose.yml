services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wrg
      POSTGRES_PASSWORD: wrg
      POSTGRES_DB: wrg
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrg"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  seed-baton-rouge:
    profiles: ["baton-rouge"]
    build: .
    environment:
      DATABASE_URL: postgresql://wrg:wrg@postgres:5432/wrg
      BR_SEED_SOURCE: /seed-data/Baton Rouge 24-26.zip
      BR_REPORT_SOURCE: /report-data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../Baton Rouge 24-26.zip:/seed-data/Baton Rouge 24-26.zip:ro
      - ../BR 2024 - Benchmark Comparisons.xlsx:/report-data/BR 2024 - Benchmark Comparisons.xlsx:ro
      - ../BR 2024 - Benefits & Best Practices.xlsx:/report-data/BR 2024 - Benefits & Best Practices.xlsx:ro
      - ../Baton Rouge 2025 - Workforce Benchmark Comparisons.xlsx:/report-data/Baton Rouge 2025 - Workforce Benchmark Comparisons.xlsx:ro
      - ../Baton Rouge 2025 - Benefits & Best Practices.xlsx:/report-data/Baton Rouge 2025 - Benefits & Best Practices.xlsx:ro
      - ../BR 2026 - Workforce Benchmark Comparisons.xlsx:/report-data/BR 2026 - Workforce Benchmark Comparisons.xlsx:ro
      - ../BR 2026 - Benefits & Best Practices.xlsx:/report-data/BR 2026 - Benefits & Best Practices.xlsx:ro
    command:
      - sh
      - -c
      - npm run db:deploy:production && npm run db:seed:baton-rouge:compiled

volumes:
  postgres-data:
  minio-data:
